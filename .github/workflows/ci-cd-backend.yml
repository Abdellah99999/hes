name: CI/CD - Backend API & Microservices

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "infrastructure/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/ci-cd-backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "infrastructure/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/ci-cd-backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Quality Gate: Lint, Typecheck, Unit & Integration Tests
  # ===========================================================================
  quality-gate:
    name: 🛡️ Quality Gate (Lint, Types & 148 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install Root Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: pnpm --filter @hes/api prisma:generate

      - name: ESLint Verification
        run: pnpm --filter @hes/api lint

      - name: TypeScript Static Typecheck
        run: pnpm --filter @hes/api typecheck

      - name: Run Backend Test Suite (All 27 Suites, 148 Tests)
        run: pnpm --filter @hes/api test

  # ===========================================================================
  # 2. Security Gate: OWASP Top 10, Concurrency & Dependency Audit
  # ===========================================================================
  security-gate:
    name: 🔒 Security Gate (OWASP Top 10 & Load Benchmarks)
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: pnpm --filter @hes/api prisma:generate

      - name: Run Automated OWASP Top 10 Security Audit
        run: pnpm --filter @hes/api test phase17-security-owasp-audit.spec.ts

      - name: Run Concurrency & High-Load Benchmark
        run: pnpm --filter @hes/api test phase17-performance-load.spec.ts

      - name: Dependency Vulnerability Audit
        run: pnpm --dir backend audit --audit-level=high

  # ===========================================================================
  # 3. Containerization: Docker Build & Image Packaging
  # ===========================================================================
  docker-build:
    name: 🐳 Docker Container Build & Tagging
    needs: security-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            hes-api:latest
            hes-api:${{ github.sha }}

  # ===========================================================================
  # 4. Deployment: Production Release with Health Verification
  # ===========================================================================
  deploy:
    name: 🚀 Production Release (Zero-Downtime Rolling Update)
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Production Cluster
        run: |
          echo "Deploying hes-api:${{ github.sha }} with zero-downtime rolling update..."
          # docker compose -f backend/docker-compose.prod.yml up -d --no-deps backend
      - name: Post-Deploy Healthcheck Verification
        run: |
          echo "Verifying /api/v1/health/liveness probe..."
