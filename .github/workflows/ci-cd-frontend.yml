name: CI/CD - Frontend Web Client

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "infrastructure/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/ci-cd-frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "infrastructure/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/ci-cd-frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Quality Gate: Lint, Typecheck, Component & E2E Tests (91 tests)
  # ===========================================================================
  quality-gate:
    name: 🎨 Quality Gate (Lint, Types & 91 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: ESLint Verification
        run: pnpm --filter @hes/web lint

      - name: TypeScript Static Typecheck
        run: pnpm --filter @hes/web typecheck

      - name: Run Vitest Suite (All 24 Test Files, 91 Tests)
        run: pnpm --filter @hes/web exec vitest run

  # ===========================================================================
  # 2. Security Gate: Production SPA Build & Secret Leakage Audit
  # ===========================================================================
  security-gate:
    name: 🔒 Security Gate (Build & Zero Leaked Secrets)
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Production Web SPA Bundle
        run: pnpm --filter @hes/web build

      - name: Automated Security Check - Verify 0 Leaked Secrets in Bundle
        run: node infrastructure/scripts/check-frontend-secrets.mjs

      - name: Dependency Vulnerability Audit
        run: pnpm --dir frontend audit --audit-level=high

  # ===========================================================================
  # 3. Containerization: Docker Nginx SPA Build
  # ===========================================================================
  docker-build:
    name: 🐳 Docker Container Build & Tagging
    needs: security-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: |
            hes-web:latest
            hes-web:${{ github.sha }}

  # ===========================================================================
  # 4. Deployment: Atomic Web Assets Release
  # ===========================================================================
  deploy:
    name: 🚀 Production Release (Atomic Deployment & Cache Purge)
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Frontend Container
        run: |
          echo "Deploying hes-web:${{ github.sha }} to production gateway..."
          # docker compose -f frontend/docker-compose.prod.yml up -d --no-deps frontend
      - name: Purge CDN Cache
        run: |
          echo "Purging CDN edge cache for index.html..."
