name: CI - Frontend Web

on:
  push:
    branches: [main, master, develop]
    paths:
      - "frontend/**"
      - "infrastructure/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "frontend/**"
      - "infrastructure/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend-checks:
    name: Lint, Typecheck, Tests & Secret Audit (Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Dependency Vulnerability Audit
        run: pnpm --dir frontend audit --audit-level=high

      - name: Contract Testing - Verify API Client Sync with OpenAPI
        run: |
          pnpm --dir backend prisma:generate
          pnpm --dir backend openapi:export
          pnpm --dir frontend gen:api
          git diff --exit-code frontend/src/api/

      - name: Lint Web
        run: pnpm --dir frontend lint

      - name: Typecheck Web
        run: pnpm --dir frontend typecheck

      - name: Run Unit & Component Tests
        run: pnpm --dir frontend test

      - name: Build Web Production SPA
        run: pnpm --dir frontend build

      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: E2E Real Browser & Visual Non-Regression Tests (Playwright)
        run: |
          pnpm --dir frontend preview --port 5173 --host &
          SERVER_PID=$!
          for i in {1..30}; do
            curl -s -I http://127.0.0.1:5173 && break || sleep 1
          done
          node frontend/scripts/e2e-real-browser-test.mjs
          kill $SERVER_PID || true
        env:
          CI: "true"
          BASE_URL: "http://127.0.0.1:5173"

      - name: Upload Visual Regression Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-screenshots
          path: docs/qa/screenshots/
          if-no-files-found: ignore

      - name: Security Check - Verify No Leaked Secrets in Bundle
        run: node infrastructure/scripts/check-frontend-secrets.mjs

      - name: Verify Dockerfile Build
        run: docker build -f frontend/Dockerfile -t hes-web:test frontend
