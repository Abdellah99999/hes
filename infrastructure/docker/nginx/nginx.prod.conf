# =============================================================================
# HES Logistics Platform - Hardened Production Nginx Gateway Configuration
# CYBERSECURITY COMPLIANCE:
# - Mandatory HTTPS (HTTP 301 Permanent Redirect)
# - Strict Transport Security (HSTS - 2 years preload)
# - Robust TLS 1.2/1.3 ciphers, PFS, OCSP Stapling
# - Content Security Policy, Clickjacking & MIME-sniffing Protection
# - Segregated Reverse Proxy Routing: /api/ -> Backend, / -> Frontend
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version
    server_tokens off;

    # Performance & System calls
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Buffer limits preventing buffer overflow attacks
    client_body_buffer_size      128k;
    client_max_body_size         25M;   # Accommodates delivery proof photo uploads
    client_header_buffer_size    1k;
    large_client_header_buffers  4 8k;

    # Logging format with correlation ID tracking
    log_format production_json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$http_x_request_id",'
        '"correlation_id":"$http_x_correlation_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log production_json;
    error_log  /var/log/nginx/error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (DDoS & Brute Force Prevention)
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=static_rate_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Definitions
    upstream backend_cluster {
        server backend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_cluster {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # =========================================================================
    # Server Block 1: Port 80 - Mandatory HTTPS Redirect
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health probe accessible over plain HTTP for internal load balancers
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Redirect all other traffic to HTTPS permanent
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Server Block 2: Port 443 - Hardened HTTPS Gateway
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # TLS Certificates
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # TLS Protocols & Cipher Suites (Strictly TLS 1.2 & 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.google.com https://*.googleapis.com; connect-src 'self' https:; frame-ancestors 'self';" always;

        # Connection Limit per IP
        limit_conn conn_limit 50;

        # Health endpoint
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ---------------------------------------------------------------------
        # Reverse Proxy: Backend API (/api/)
        # ---------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_rate_limit burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # HTTP Headers Propagation
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ---------------------------------------------------------------------
        # Reverse Proxy: Frontend SPA (/)
        # ---------------------------------------------------------------------
        location / {
            limit_req zone=static_rate_limit burst=50 nodelay;

            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Cache static assets served through proxy
        location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|ico|webp)$ {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
