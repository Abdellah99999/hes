packages:
  - "backend"
  - "frontend"

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  argon2: true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "@scarf/scarf"

overrides:
  js-yaml: ">=4.3.1"
  deepmerge-ts: ">=8.0.0"
  orval: ">=8.22.0"
